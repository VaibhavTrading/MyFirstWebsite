services:
  - type: web
    name: smartvletool
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://docs.opencv.org https://cdnjs.cloudflare.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' data: blob: https:; worker-src 'self' blob:; frame-ancestors 'none';"
    routes:
      - type: rewrite
        source: /document-enhance
        destination: /document-enhance/index.html
      - type: rewrite
        source: /document-enhance/
        destination: /document-enhance/index.html
      - type: rewrite
        source: /image-to-pdf
        destination: /image-to-pdf/index.html
      - type: rewrite
        source: /image-to-pdf/
        destination: /image-to-pdf/index.html
      - type: rewrite
        source: /pdf-compress
        destination: /pdf-compress/index.html
      - type: rewrite
        source: /pdf-compress/
        destination: /pdf-compress/index.html
      - type: rewrite
        source: /document-studio
        destination: /document-studio/index.html
      - type: rewrite
        source: /document-studio/
        destination: /document-studio/index.html
      - type: rewrite
        source: /id-card-print
        destination: /id-card-print/index.html
      - type: rewrite
        source: /id-card-print/
        destination: /id-card-print/index.html
      - type: rewrite
        source: /id-card-studio
        destination: /id-card-studio/index.html
      - type: rewrite
        source: /id-card-studio/
        destination: /id-card-studio/index.html
      - type: rewrite
        source: /image-compress
        destination: /image-compress/index.html
      - type: rewrite
        source: /image-compress/
        destination: /image-compress/index.html
      - type: rewrite
        source: /photo-resize
        destination: /photo-resize/index.html
      - type: rewrite
        source: /photo-resize/
        destination: /photo-resize/index.html
      - type: rewrite
        source: /image-crop
        destination: /image-crop/index.html
      - type: rewrite
        source: /image-crop/
        destination: /image-crop/index.html
      - type: rewrite
        source: /image-convert
        destination: /image-convert/index.html
      - type: rewrite
        source: /image-convert/
        destination: /image-convert/index.html
      - type: rewrite
        source: /image-adjust
        destination: /image-adjust/index.html
      - type: rewrite
        source: /image-adjust/
        destination: /image-adjust/index.html
      - type: rewrite
        source: /pdf-watermark
        destination: /pdf-watermark/index.html
      - type: rewrite
        source: /pdf-watermark/
        destination: /pdf-watermark/index.html
      - type: rewrite
        source: /image-pdf-editor
        destination: /image-pdf-editor/index.html
      - type: rewrite
